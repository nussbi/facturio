name: Sync verified app source
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Temporary private archive URL
        required: true
        type: string
      expected_head:
        description: Exact main commit approved for synchronization
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: facturio-source-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci-build-only.db
      SOURCE_URL: ${{ inputs.source_url }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      SOURCE_SHA256: 45b4dc9f596058b1c8749bbb60ef41b10d960e5f47eaac253b285c3b616410c5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Verify base commit and download source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_URL"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          curl --fail --silent --show-error --location "$SOURCE_URL" --output "$RUNNER_TEMP/source.zip"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/source.zip" | sha256sum --check --status
      - name: Validate and restore manifest files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path.cwd()
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'source.zip') as archive:
              manifest = json.loads(archive.read('SOURCE-MANIFEST.json'))
              expected = set(manifest) | {'SOURCE-MANIFEST.json'}
              assert set(archive.namelist()) == expected
              for name in sorted(expected):
                  relative = pathlib.PurePosixPath(name)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert '.git' not in relative.parts and '.github' not in relative.parts
                  data = archive.read(name)
                  if name in manifest:
                      assert hashlib.sha256(data).hexdigest() == manifest[name]['sha256']
                  destination = root.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
          print(f'Restored {len(expected)} verified files')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies and generate Prisma
        run: |
          npm ci
          npx prisma generate --schema prisma/schema.prisma
      - name: Signing, portal and branding regression tests
        run: node --test src/lib/signing-flow.test.cjs src/lib/customer-portal*.test.cjs src/lib/brand.test.cjs
      - name: Build existing Cloudflare application
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
      - name: Verify source remained unchanged and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('SOURCE-MANIFEST.json').read_text())
          for name, expected in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected['sha256'], name
          print(f'Verified {len(manifest)} source checksums after build')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add guest sender email with validated Reply-To for signing requests'
          git push origin HEAD:main
          printf 'Verified source commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
